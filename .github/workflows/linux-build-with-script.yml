name: Linux CI using build script
run-name: "Linux CI using build script ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      continue-on-error: true
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
    - name: Install llvm, clang 17
      shell: bash
      run: |
          sudo apt purge llvm-16 clang-16 llvm-17 llvm-18 clang-17 clang-18 -y || true
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt install libclang-17-dev -y

    - name: Build only ChplX using provided script
      shell: bash
      run: |
          python3 benchmark.py --build-only
